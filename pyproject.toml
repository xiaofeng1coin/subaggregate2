# =================================================================
# ==                  最终混合式解决方案                         ==
# =================================================================

[tool.commitizen]
# [关键] 告诉 commitizen，解析 commit message 时使用我们下面的自定义规则
name = "cz_customize"

# [无改动] 基本版本信息
version = "1.0.1"
version_scheme = "semver"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

# [无改动] 版本号所在的文件及匹配规则
version_files = [
    "android_app/app/build.gradle.kts"
]
version_pattern = 'versionName = "(?P<version>.*)"'

# [!!! 关键恢复 !!!]
# 我们将这个部分放回顶层，专门给 'cz bump' 命令看。
# 它定义了 'fix' 会将版本号的 PATCH 位 +1。
[tool.commitizen.change_type_map]
fix = "PATCH"
feat = "MINOR"
perf = "PATCH"
refactor = "PATCH"
build = "NONE"
chore = "NONE"
ci = "NONE"
docs = "NONE"
style = "NONE"
test = "NONE"


# [!!! 关键保留 !!!]
# 我们保留这个部分，专门给 'cz check' 和解析器用。
# 它定义了如何正确解析包含中文冒号和可选空格的 commit。
[tool.commitizen.customize]
commit_parser = "(?P<change_type>fix|feat|build|chore|ci|docs|perf|refactor|revert|style|test)(?:\\((?P<scope>[^()\\r\\n]*)\\))?(?P<breaking>!)?(?P<is_breaking>BREAKING CHANGE)?(：|:)\\s?(?P<subject>.*(?:\\s(?:.*))?)"
change_parser = "(?P<change_type>fix|feat|build|chore|ci|docs|perf|refactor|revert|style|test)(?:\\((?P<scope>[^()\\r\\n]*)\\))?(?P<breaking>!)?(?P<is_breaking>BREAKING CHANGE)?(：|:)\\s?(?P<subject>.*(?:\\s(?:.*))?)"

# 下面的部分是为了让 'cz commit' 命令（如果在本地使用）也能正常工作，保留即可
message_builder = "_{change_type}{scope}: {subject}"
questions = [
    { type = "list", name = "change_type", message = "Select the type of change you are committing", choices = ["fix", "feat", "chore", "docs", "style", "refactor", "perf", "test", "build", "ci"] },
    { type = "input", name = "scope", message = "What is the scope of this change (e.g., component or file name)? (press enter to skip)\n" },
    { type = "input", name = "subject", message = "Write a short, imperative tense description of the change:\n" },
    { type = "input", name = "body", message = "Provide a longer description of the change: (press enter to skip)\n" },
    { type = "confirm", name = "is_breaking_change", message = "Are there any breaking changes?", default = false },
    { type = "input", name = "footer", message = "Footer. Information about Breaking Changes and reference issues that this commit closes: (press enter to skip)\n" }
]
