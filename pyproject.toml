# 这是 commitizen 工具的配置文件
[tool.commitizen]
# ！！！关键修正！！！
# 我们必须在这里提供一个初始的版本号，作为版本提升的起点。
# 你可以根据你的实际情况修改这个初始版本。
version = "1.0.1"

# 告知 commitizen 我们使用语义化版本（例如：1.2.3）
version_scheme = "semver"

# 指定版本号所在的其他文件路径
version_files = [
    "android_app/app/build.gradle.kts"
]

# 用来在其他文件中查找和替换版本号的正则表达式
version_pattern = 'versionName = "(?P<version>.*)"'

# 开启自动更新 CHANGELOG.md 文件
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
