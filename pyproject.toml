# 这个文件是 commitizen 工具的专用配置文件
[tool.commitizen]
# 告知 commitizen 我们使用语义化版本（例如：1.2.3）
version_scheme = "semver"

# 指定版本号所在的文件路径
# 注意：路径必须是从项目根目录开始计算的
version_files = [
    "android_app/app/build.gradle.kts"
]

# 这是一个正则表达式，用来在上面的文件中找到并替换版本号
# 它会精确匹配 versionName = "..." 这一行
# (?P<version>.*) 是 commitizen 要求的，用来捕获版本号本身
version_pattern = 'versionName = "(?P<version>.*)"'

# 开启自动在版本更新时创建或更新 CHANGELOG.md 文件
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
