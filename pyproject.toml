# 这是 commitizen 工具的配置文件
[tool.commitizen]
# [无改动] 初始版本号
version = "1.0.1"

# [无改动] 使用语义化版本
version_scheme = "semver"

# [无改动] 版本号所在的其他文件路径
version_files = [
    "android_app/app/build.gradle.kts"
]

# [无改动] 查找和替换版本号的正则表达式
version_pattern = 'versionName = "(?P<version>.*)"'

# [无改动] 开启自动更新 CHANGELOG.md
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

# [无改动] 规定了不同 commit 类型如何影响版本号
[tool.commitizen.change_type_map]
fix = "PATCH"
feat = "MINOR"
perf = "PATCH"
refactor = "PATCH"
build = "null"
chore = "null"
ci = "null"
docs = "null"
style = "null"
test = "null"


# ==============================================================
# ==                 [！！！关键新增部分！！！]                  ==
# ==============================================================

# 自定义 commitizen 的行为，以解决 commit message 格式验证过于严格的问题
[tool.commitizen.customize]
# 这是 commitizen 用来解析 commit message 的正则表达式。
# 我们对官方版本做了微小修改，使其更加宽松：
# 1. `(：|:)`：同时接受英文冒号 `:` 和中文冒号 `：`。
# 2. `\s?`：冒号后面的空格变为可选（可以有，也可以没有）。
message_parser = "cz_conventional_commits.parser.ConventionalCommitsParser"
change_parser = "cz_conventional_commits.parser.ConventionalCommitsParser"
commit_parser = "(?P<change_type>fix|feat|build|chore|ci|docs|perf|refactor|revert|style|test)(?:\\((?P<scope>[^()\\r\\n]*)\\))?(?P<breaking>!)?(?P<is_breaking>BREAKING CHANGE)?(：|:)\\s?(?P<subject>.*(?:\\s(?:.*))?)"

# 同时，我们确保 `cz check` 命令也使用这个新的、宽松的规则
[tool.commitizen.check_patterns]
# 这个正则表达式需要匹配我们上面定义的 commit_parser 规则
"(?s)(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\(\\S+\\))?!?(：|:)\\s?(.+)" = "subject"

