# =================================================================
# ==              最终融合版 (Truly Final Version)               ==
# =================================================================
# 结合了自动版本管理，并采纳了您在旧工作流中已被验证的、
# 强制创建 gradle.properties 文件的成功经验，以确保构建的绝对稳定。
# =================================================================

name: Automatic Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- 自动版本管理 ---
      - name: Bump version and write changelog
        id: cz
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update Version Code in build.gradle.kts
        if: steps.cz.outputs.version
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE
          echo "Updated versionCode in $GRADLE_FILE to $VERSION_CODE"

      - name: Commit all version changes
        if: steps.cz.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ steps.cz.outputs.version }}"
          # 无需 file_pattern，自动提交所有变更

      # --- 安卓构建步骤 ---
      
      - name: Prepare Python source for Android build
        run: |
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # [采纳您的成功经验] 强制创建正确的 gradle.properties 文件，避免环境问题
      - name: Force create correct gradle.properties
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo ">>> Forcibly creating $PROPERTIES_FILE to ensure build stability"
          echo "android.useAndroidX=true" > $PROPERTIES_FILE
          echo "android.enableJetifier=true" >> $PROPERTIES_FILE
          echo ">>> Verification: Contents of $PROPERTIES_FILE:"
          cat $PROPERTIES_FILE

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        if: steps.cz.outputs.version
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace
        
      # --- 发布步骤 ---

      - name: Rename APK for Release
        if: steps.cz.outputs.version
        id: rename_apk
        run: |
          ARTIFACT_PATH="android_app/app/build/outputs/apk/debug"
          VERSION="${{ steps.cz.outputs.version }}"
          ORIGINAL_APK_NAME="app-debug.apk"
          NEW_APK_NAME="SubAggregator-v${VERSION}.apk"
          mv "${ARTIFACT_PATH}/${ORIGINAL_APK_NAME}" "${ARTIFACT_PATH}/${NEW_APK_NAME}"
          echo "Renamed APK to ${NEW_APK_NAME}"
          echo "final_apk_path=${ARTIFACT_PATH}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        if: steps.cz.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cz.outputs.changelog }}
          tag_name: "v${{ steps.cz.outputs.version }}"
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
          make_latest: true
