# 文件路径: .github/workflows/android-build.yml
# 终极版：全自动版本管理和发布流程 (已修复Action版本号错误)

name: Automatic Build, Versioning, and Release

on:
  push:
    branches:
      - "master" # 每次推送到 master 分支时触发
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 我们需要获取所有历史记录来分析提交，并需要一个token来推送更改
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 2: [核心] 自动计算版本号并创建更新日志
      - name: Bump version and write changelog
        id: cz
        # [关键修正] 使用正确的主版本标签 @v0
        uses: commitizen-tools/commitizen-action@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version_files: |
            android_app/app/build.gradle.kts
          version_scheme: semver
          
      # 步骤 3: 使用 sed 命令精确更新 build.gradle.kts 中的版本号
      - name: Update Version in build.gradle.kts
        if: steps.cz.outputs.version # 只有在版本号发生变化时才执行
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          
          echo "New Version: $VERSION"
          echo "New Version Code: $VERSION_CODE"
          
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" $GRADLE_FILE
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE

          echo "--- build.gradle.kts after update ---"
          cat $GRADLE_FILE
          echo "-------------------------------------"
          
      # 步骤 4: 提交版本号的变更
      - name: Commit version update
        if: steps.cz.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ steps.cz.outputs.version }}"
          file_pattern: "android_app/app/build.gradle.kts"

      # === 后续步骤 ===

      - name: Prepare Python source for Android build
        run: |
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Force create gradle.properties
        run: |
          {
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
          } > android_app/gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        if: steps.cz.outputs.version 
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Rename APK
        if: steps.cz.outputs.version
        id: rename_apk
        run: |
          ARTIFACT_PATH="android_app/app/build/outputs/apk/debug"
          VERSION="${{ steps.cz.outputs.version }}"
          ORIGINAL_APK_NAME="app-debug.apk"
          NEW_APK_NAME="SubAggregator-v${VERSION}.apk"
          mv "${ARTIFACT_PATH}/${ORIGINAL_APK_NAME}" "${ARTIFACT_PATH}/${NEW_APK_NAME}"
          echo "Renamed APK to ${NEW_APK_NAME}"
          echo "final_apk_path=${ARTIFACT_PATH}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        if: steps.cz.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cz.outputs.changelog }}
          tag_name: "v${{ steps.cz.outputs.version }}"
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
          make_latest: true
