# =================================================================
# ==          最终修复版 - 解决 AndroidX 编译问题              ==
# =================================================================

name: Build and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    outputs:
      build_type: ${{ steps.prepare_build.outputs.BUILD_TYPE }}
      new_version: ${{ steps.bump_version.outputs.new_version }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: 3. 检查是否为 'fix' 提交
        id: check_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == "fix"* ]]; then
            echo "IS_FIX_COMMIT=true" >> $GITHUB_OUTPUT
            echo "✅ 'fix' commit detected. Starting release process."
          else
            echo "IS_FIX_COMMIT=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not a 'fix' commit. Starting debug build."
          fi

      - name: 4. [仅发布] 计算新版本号并生成日志
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'true'
        id: bump_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0)
          echo "Found last tag: ${LAST_TAG}"
          LAST_VERSION=$(echo $LAST_TAG | sed 's/^v//')
          MAJOR=$(echo $LAST_VERSION | cut -d. -f1)
          MINOR=$(echo $LAST_VERSION | cut -d. -f2)
          PATCH=$(echo $LAST_VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "✅ Calculated new version: ${NEW_VERSION}"
          CHANGELOG_BODY="* ${{ github.event.head_commit.message }}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "changelog_body<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG_BODY}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: 5. [仅发布] 更新 Gradle 版本文件
        if: steps.bump_version.outputs.new_version
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          echo "Updating build.gradle.kts to version $NEW_VERSION"
          sed -i "s/versionName = .*/versionName = \"$NEW_VERSION\"/" android_app/app/build.gradle.kts
          VERSION_CODE=$(echo "$NEW_VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" android_app/app/build.gradle.kts

      - name: 6. [仅发布] 提交版本更改
        if: steps.bump_version.outputs.new_version
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          git add android_app/app/build.gradle.kts
          git commit -m "chore(release): bump version to v${NEW_VERSION}" -m "[skip ci]"
          git push origin master

      - name: 7. 准备构建环境
        id: prepare_build
        run: |
          if [[ -n "${{ steps.bump_version.outputs.new_version }}" ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_OUTPUT
          else
            echo "BUILD_TYPE=Debug" >> $GITHUB_OUTPUT
          fi
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp app.py clash_template.yaml data.json requirements.txt $ANDROID_PYTHON_TARGET_DIR/ || true
          cp -r src_py/. $ANDROID_PYTHON_TARGET_DIR/ || true

      - name: 8. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # =======================> [新增修复步骤] <=======================
      - name: 9. [FIX] 配置 Gradle 属性以启用 AndroidX
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo "✅ Adding AndroidX and Jetifier properties to ${PROPERTIES_FILE}"
          echo "" >> $PROPERTIES_FILE
          echo "# Added by GitHub Actions to fix build" >> $PROPERTIES_FILE
          echo "android.useAndroidX=true" >> $PROPERTIES_FILE
          echo "android.enableJetifier=true" >> $PROPERTIES_FILE
      # =======================> 修复步骤结束 <=======================
      
      - name: 10. 授予 Gradle Wrapper 执行权限
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: 11. Decode and Restore Keystore
        if: steps.prepare_build.outputs.BUILD_TYPE == 'Release'
        run: |
          echo "Restoring keystore from GitHub Secrets..."
          KEYSTORE_FILE_PATH="android_app/app/my-release-key.keystore"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $KEYSTORE_FILE_PATH
          echo "Keystore restored to $KEYSTORE_FILE_PATH"

      - name: 12. 构建 Android APK
        id: build_apk
        working-directory: ./android_app
        run: |
          BUILD_TYPE="${{ steps.prepare_build.outputs.BUILD_TYPE }}"
          ./gradlew assemble${BUILD_TYPE} --stacktrace
          APK_FOLDER_NAME=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          apk_path=$(find ./app/build/outputs/apk/${APK_FOLDER_NAME} -name "*.apk" -print -quit)
          if [[ -z "$apk_path" ]]; then echo "::error::APK not found!"; exit 1; fi
          echo "APK_PATH=$apk_path" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_KEYSTORE: "my-release-key.keystore"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: 13. [仅发布] 创建 GitHub Release
        if: steps.bump_version.outputs.new_version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          name: "Release ${{ steps.bump_version.outputs.new_tag }}"
          body: ${{ steps.bump_version.outputs.changelog_body }}
          files: android_app/${{ steps.build_apk.outputs.APK_PATH }}
          make_latest: true
      
      - name: 14. [仅调试] 上传 Debug APK
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-apk
          path: android_app/${{ steps.build_apk.outputs.APK_PATH }}
