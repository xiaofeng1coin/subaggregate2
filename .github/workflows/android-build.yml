# =================================================================
# ==          最终融合版 - 保持文件结构，动态创建配置              ==
# =================================================================

name: Build and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    outputs:
      build_type: ${{ steps.prepare_build.outputs.BUILD_TYPE }}
      new_version: ${{ steps.bump_version.outputs.new_version }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: 3. 检查是否为 'fix' 提交
        id: check_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == "fix"* ]]; then
            echo "IS_FIX_COMMIT=true" >> $GITHUB_OUTPUT
            echo "✅ 'fix' commit detected. Starting release process."
          else
            echo "IS_FIX_COMMIT=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not a 'fix' commit. Starting debug build."
          fi

      - name: 4. [仅发布] 计算新版本号并生成日志
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'true'
        id: bump_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0)
          LAST_VERSION=$(echo $LAST_TAG | sed 's/^v//')
          MAJOR_MINOR=$(echo $LAST_VERSION | cut -d. -f1,2)
          PATCH=$(echo $LAST_VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR_MINOR}.${NEW_PATCH}"
          echo "✅ New version will be: v${NEW_VERSION}"
          CHANGELOG_BODY="* ${{ github.event.head_commit.message }}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "changelog_body<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG_BODY}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 5. [仅发布] 更新 Gradle 文件中的版本
        if: steps.bump_version.outputs.new_version
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          sed -i "s/versionName = .*/versionName = \"$NEW_VERSION\"/" android_app/app/build.gradle.kts
          VERSION_CODE=$(echo "$NEW_VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" android_app/app/build.gradle.kts
          
      - name: 6. [仅发布] 提交版本更改并创建 Tag
        if: steps.bump_version.outputs.new_version
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          if [[ -n $(git status -s) ]]; then
            git add android_app/app/build.gradle.kts
            git commit -m "chore(release): bump version to v${NEW_VERSION}" -m "[skip ci]"
            git tag "v${NEW_VERSION}"
            git push origin master --follow-tags
          fi

      - name: 7. 准备构建环境
        id: prepare_build
        run: |
          if [[ -n "${{ steps.bump_version.outputs.new_version }}" ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_OUTPUT
          else
            echo "BUILD_TYPE=Debug" >> $GITHUB_OUTPUT
          fi
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp app.py clash_template.yaml data.json requirements.txt $ANDROID_PYTHON_TARGET_DIR/ || true
          cp -r src_py/. $ANDROID_PYTHON_TARGET_DIR/ || true

      - name: 8. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # [!!! 关键恢复步骤 !!!]
      # 无论如何，在构建前强制在正确的项目根目录(android_app/)创建 gradle.properties 文件
      - name: 9. Force create gradle.properties to fix AndroidX issue
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo ">>> Forcibly creating gradle.properties at '$PROPERTIES_FILE'"
          {
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
            echo "org.gradle.jvmargs=-Xmx2048m"
          } > $PROPERTIES_FILE
          echo ">>> Verification: Contents of $PROPERTIES_FILE:"
          cat $PROPERTIES_FILE
      
      - name: 10. 授予 Gradle Wrapper 执行权限
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: 11. 构建 Android APK
        id: build_apk
        working-directory: ./android_app
        run: |
          BUILD_TYPE="${{ steps.prepare_build.outputs.BUILD_TYPE }}"
          ./gradlew assemble${BUILD_TYPE} --stacktrace
          APK_FOLDER_NAME=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          apk_path=$(find ./app/build/outputs/apk/${APK_FOLDER_NAME} -name "*.apk" -print -quit)
          if [[ -z "$apk_path" ]]; then echo "::error::APK not found!"; exit 1; fi
          echo "APK_PATH=$apk_path" >> "$GITHUB_OUTPUT"
          
      - name: 12. [仅发布] 创建 GitHub Release
        if: steps.bump_version.outputs.new_version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump_version.outputs.new_version }}"
          name: "Release v${{ steps.bump_version.outputs.new_version }}"
          body: ${{ steps.bump_version.outputs.changelog_body }}
          files: android_app/${{ steps.build_apk.outputs.APK_PATH }}
          make_latest: true
      
      - name: 13. [仅调试] 上传 Debug APK
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-apk
          path: android_app/${{ steps.build_apk.outputs.APK_PATH }}
