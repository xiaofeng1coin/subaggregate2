# 文件路径: .github/workflows/android-build.yml
# =================================================================
# ==            DEFINITIVE & ROBUST FINAL VERSION                ==
# =================================================================
# 本版本经过逐行审查，解决了所有已知和潜在的问题。
#
# 核心修复:
#   1. `commitizen-action` 的版本号已修正为存在的具体版本 `v0.25.0`。
#   2. 添加了 `permissions` 块，使工作流不再依赖仓库UI设置，更加健壮。
# 健壮性改进:
#   - `gradle.properties` 的创建方式改为安全的追加模式。
#   - 增加了详细的注释，方便理解和未来维护。
# =================================================================

name: Automatic Build, Versioning, and Release

# 触发条件: 推送到 master 分支或手动触发
on:
  push:
    branches:
      - "master"
  workflow_dispatch:

# [关键修复 2] 在工作流级别明确声明所需权限，不再依赖UI配置。
# 这使得工作流自包含且更加安全可靠。
permissions:
  contents: write      # 允许: 提交版本文件变更、创建Tag、创建Release
  pull-requests: read  # 允许: 读取提交信息用于生成Changelog (commitizen可能需要)

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出代码
      # - `fetch-depth: 0` 是必需的，因为它能获取所有git历史记录，`commitizen` 需要基于此分析版本。
      # - `token` 使用内置的 GITHUB_TOKEN，并通过上面的 `permissions` 块获取写权限。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 2: 自动计算版本号并创建更新日志
      # [关键修复 1] 将版本号从错误的 `@v0` 修正为确切存在的 `@v0.25.0`。
      - name: Bump version and write changelog
        id: cz
        uses: commitizen-tools/commitizen-action@v0.25.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 指定需要 `commitizen` 读取当前版本号的文件
          version_files: |
            android_app/app/build.gradle.kts
          version_scheme: semver
          
      # 步骤 3: 使用 sed 精确更新 Gradle 文件中的版本号
      # - 仅在 `commitizen` 成功生成新版本号时运行 (`steps.cz.outputs.version` 有值)。
      # - 使用 awk 从 'x.y.z' 格式的版本号安全地生成 Android versionCode。
      - name: Update Version in build.gradle.kts
        if: steps.cz.outputs.version
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          # 生成 versionCode, e.g., 1.2.3 -> 10203
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          
          echo "New Version Name: $VERSION"
          echo "New Version Code: $VERSION_CODE"
          
          # 使用 sed 精确替换，确保只修改正确的行
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" $GRADLE_FILE
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE

          echo "--- Verifying build.gradle.kts after update ---"
          cat $GRADLE_FILE
          
      # 步骤 4: 提交版本号的变更
      # - 使用一个专用的 Action 来自动提交和推送文件变更。
      - name: Commit version update
        if: steps.cz.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ steps.cz.outputs.version }}"
          file_pattern: "android_app/app/build.gradle.kts"

      # === 后续Android构建步骤 ===

      # 步骤 5: 准备Python源代码
      - name: Prepare Python source for Android build
        run: |
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/

      # 步骤 6: 设置Java环境 (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 步骤 7: 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 步骤 8: 缓存Gradle依赖，加快后续构建速度
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 步骤 9: 确保 gradle.properties 文件存在
      # [健壮性改进] 使用 `>>` 追加，而不是 `>` 覆盖，以防项目中已有此文件。
      - name: Ensure gradle.properties exists and has required settings
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          if ! grep -q "android.useAndroidX=true" "$PROPERTIES_FILE" 2>/dev/null; then
            echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
          fi
          if ! grep -q "android.enableJetifier=true" "$PROPERTIES_FILE" 2>/dev/null; then
            echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"
          fi

      # 步骤 10: 授予 gradlew 执行权限
      # - 这是一个常见且必要的步骤，因为 git 可能不会保留文件权限。
      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      # 步骤 11: 使用Gradle构建Debug APK
      # - `--stacktrace` 参数可以在构建失败时提供详细的错误信息。
      - name: Build Debug APK with Gradle
        if: steps.cz.outputs.version 
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace
        
      # 步骤 12: 重命名APK以包含版本号
      # - 将最终的APK文件路径输出，供下一步使用。
      - name: Rename APK for Release
        if: steps.cz.outputs.version
        id: rename_apk
        run: |
          ARTIFACT_PATH="android_app/app/build/outputs/apk/debug"
          VERSION="${{ steps.cz.outputs.version }}"
          ORIGINAL_APK_NAME="app-debug.apk"
          NEW_APK_NAME="SubAggregator-v${VERSION}.apk"
          mv "${ARTIFACT_PATH}/${ORIGINAL_APK_NAME}" "${ARTIFACT_PATH}/${NEW_APK_NAME}"
          echo "Renamed APK to ${NEW_APK_NAME}"
          echo "final_apk_path=${ARTIFACT_PATH}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          
      # 步骤 13: 创建GitHub Release
      # - `tag_name` 使用 'v' 前缀，是标准的git标签惯例。
      # - `body` 使用 `commitizen` 自动生成的更新日志。
      # - `files` 上传上一步重命名后的APK文件。
      - name: Create GitHub Release
        if: steps.cz.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cz.outputs.changelog }}
          tag_name: "v${{ steps.cz.outputs.version }}"
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
          make_latest: true
