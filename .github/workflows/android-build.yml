# =================================================================
# ==                   最终决战版 - 锁定并修复了所有问题              ==
# =================================================================
# 1. 确认 `pyproject.toml` 包含初始 version。
# 2. [最新修复] 解决了 `git-auto-commit` 因 `CHANGELOG.md` 
#    不存在而失败的问题。
# =================================================================

name: Automatic Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and write changelog
        id: cz
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update Version Code in build.gradle.kts
        if: steps.cz.outputs.version
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          
          echo "New Version: $VERSION"
          echo "New Version Code: $VERSION_CODE"
          
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE

          echo "--- build.gradle.kts after update ---"
          cat $GRADLE_FILE
          echo "-------------------------------------"
          
      # [最终修正] 删除了 file_pattern 参数。
      # 该 Action 现在会自动检测并提交所有已更改的文件。
      # 无论 CHANGELOG.md 是否被更新，此步骤都能成功。
      - name: Commit all version changes
        if: steps.cz.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ steps.cz.outputs.version }}"

      # === 后续安卓构建步骤（保持不变） ===

      - name: Prepare Python source for Android build
        run: |
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        if: steps.cz.outputs.version 
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Rename APK for Release
        if: steps.cz.outputs.version
        id: rename_apk
        run: |
          ARTIFACT_PATH="android_app/app/build/outputs/apk/debug"
          VERSION="${{ steps.cz.outputs.version }}"
          ORIGINAL_APK_NAME="app-debug.apk"
          NEW_APK_NAME="SubAggregator-v${VERSION}.apk"
          mv "${ARTIFACT_PATH}/${ORIGINAL_APK_NAME}" "${ARTIFACT_PATH}/${NEW_APK_NAME}"
          echo "Renamed APK to ${NEW_APK_NAME}"
          echo "final_apk_path=${ARTIFACT_PATH}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        if: steps.cz.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cz.outputs.changelog }}
          tag_name: "v${{ steps.cz.outputs.version }}"
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
          make_latest: true
