# 文件路径: .github/workflows/android-build.yml

name: Build Android APK

on:
  push:
    branches: [ "master" ]
    paths:
      - 'android_app/**'
      - 'src_py/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # [关键修正 1] 将 Python 源码复制到正确的扁平化项目路径
      - name: Prepare Python source for Android build
        run: |
          echo "Copying Python source files to the correct Android project structure..."
          # 1. 创建安卓项目存放Python源码的目录 (去掉了中间的 /app)
          mkdir -p android_app/src/main/python
          # 2. 将 src_py/ 目录下的所有内容递归复制到正确的目标目录
          cp -r src_py/* android_app/src/main/python/
          echo "Python source files copied successfully."
          # 3. 打印出正确的目录树进行检查
          echo "Final structure of python source directory:"
          ls -R android_app/src/main/python/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 缓存可以保留，但我们会在构建时强制刷新
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android_app/**/*.gradle*', 'android_app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      # [关键修正 2] 使用带清洁功能的命令进行构建，以消除缓存影响
      - name: Build Debug APK with Gradle (Forced Clean)
        working-directory: ./android_app
        run: ./gradlew clean assembleDebug --no-build-cache --refresh-dependencies

      # [关键修正 3] 从正确的路径上传生成的 APK
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          # 使用新的、扁平化的输出路径 (去掉了中间的 /app)
          path: android_app/build/outputs/apk/debug/app-debug.apk
