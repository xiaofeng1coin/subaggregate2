# 文件路径: .github/workflows/android-build.yml
# =================================================================
# ==            GUARANTEED FINAL & STABLE VERSION                ==
# =================================================================
# 本版本修复了Action版本解析的根本问题。
#
# 核心修正：
#   - `commitizen-action` 的调用方式从一个不存在的版本标签
#     修改为指向一个确切的、永不改变的 “提交哈希”。
#     这确保了工作流的长期稳定性和可重复性。
# =================================================================

name: Automatic Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 2: 自动计算版本号并创建更新日志
      # [终极修正] 使用确切的Commit SHA来指定Action版本。
      # 这样可以100%保证能找到Action，且版本永远不会意外改变，这是最稳妥的实践。
      - name: Bump version and write changelog
        id: cz
        uses: commitizen-tools/commitizen-action@0b7593f619717621184a44ed01542f7c220ea9b4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version_files: |
            android_app/app/build.gradle.kts
          version_scheme: semver
          
      # 步骤 3: 使用 sed 命令精确更新 build.gradle.kts 中的版本号
      - name: Update Version in build.gradle.kts
        if: steps.cz.outputs.version
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          
          echo "New Version: $VERSION"
          echo "New Version Code: $VERSION_CODE"
          
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" $GRADLE_FILE
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE

          echo "--- build.gradle.kts after update ---"
          cat $GRADLE_FILE
          echo "-------------------------------------"
          
      # 步骤 4: 提交版本号的变更
      - name: Commit version update
        if: steps.cz.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ steps.cz.outputs.version }}"
          file_pattern: "android_app/app/build.gradle.kts"

      # === 后续步骤保持不变，它们都是正确的 ===

      - name: Prepare Python source for Android build
        run: |
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradle.properties exists and has required settings
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          if ! grep -q "android.useAndroidX=true" "$PROPERTIES_FILE" 2>/dev/null; then
            echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
          fi
          if ! grep -q "android.enableJetifier=true" "$PROPERTIES_FILE" 2>/dev/null; then
            echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"
          fi

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        if: steps.cz.outputs.version 
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Rename APK for Release
        if: steps.cz.outputs.version
        id: rename_apk
        run: |
          ARTIFACT_PATH="android_app/app/build/outputs/apk/debug"
          VERSION="${{ steps.cz.outputs.version }}"
          ORIGINAL_APK_NAME="app-debug.apk"
          NEW_APK_NAME="SubAggregator-v${VERSION}.apk"
          mv "${ARTIFACT_PATH}/${ORIGINAL_APK_NAME}" "${ARTIFACT_PATH}/${NEW_APK_NAME}"
          echo "Renamed APK to ${NEW_APK_NAME}"
          echo "final_apk_path=${ARTIFACT_PATH}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        if: steps.cz.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cz.outputs.changelog }}
          tag_name: "v${{ steps.cz.outputs.version }}"
          files: ${{ steps.rename_apk.outputs.final_apk_path }}
          make_latest: true

