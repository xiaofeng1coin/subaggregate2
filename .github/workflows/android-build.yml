# =================================================================
# ==            全新智能条件发布版 (Final Intelligent)           ==
# =================================================================
# 1. 只有 'fix:' 开头的 commit 会触发版本提升和 GitHub Release。
# 2. 其他所有 commit (feat, chore 等) 会构建调试包并上传到 Artifacts。
# 3. 完全采纳您成功的 gradle.properties 创建经验。
# 4. 优化了步骤和命名，逻辑更清晰。
# =================================================================

name: Conditional Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write # 必须，用于推送版本更新和创建 Release
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # [关键] 定义一个输出，用于在 job 之间传递信息。这里我们用不到，但保留作为最佳实践。
    outputs:
      new_version: ${{ steps.cz_bump.outputs.version }}
      build_type: ${{ steps.prepare_build.outputs.BUILD_TYPE }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须获取全部历史记录
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 3. Install Commitizen
        run: pip install commitizen

      - name: 4. Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: 5. [RELEASE ONLY] Bump Version & Changelog with Commitizen
        # 只有当 commit message 以 "fix:" 开头时才运行此步骤
        if: startsWith(github.event.head_commit.message, 'fix:')
        id: cz_bump
        run: |
          # 运行 cz bump 来读取 commit，提升版本，并更新文件
          # The --yes flag auto-confirms prompts.
          cz bump --yes
          
          # 将新版本号和变更日志提取为输出变量，供后续步骤使用
          new_version=$(cz version --project)
          changelog=$(cz changelog --start-rev v`cz version --project -prv` v$new_version)
          
          echo "version=${new_version}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${changelog}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "New Version: $new_version"

      - name: 6. [RELEASE ONLY] Update Version Code in Gradle
        # 同样，只在版本提升成功后运行
        if: steps.cz_bump.outputs.version
        run: |
          VERSION="${{ steps.cz_bump.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE
          echo "Updated versionCode in $GRADLE_FILE to $VERSION_CODE"

      - name: 7. [RELEASE ONLY] Commit and Push Version Changes
        # 同样，只在版本提升成功后运行
        if: steps.cz_bump.outputs.version
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore(release): bump version to v${{ steps.cz_bump.outputs.version }} [skip ci]"
            git push
          else
            echo "No version changes to commit."
          fi
          
      - name: 8. Prepare Build Environment & Source Files
        id: prepare_build
        run: |
          # 确定构建类型
          if [[ "${{ startsWith(github.event.head_commit.message, 'fix:') }}" == "true" ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_OUTPUT
            echo "Build Type: Release"
          else
            echo "BUILD_TYPE=Debug" >> $GITHUB_OUTPUT
            echo "Build Type: Debug"
          fi
          
          # 准备 Python 源码
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          # [注意] 从您的旧 workflow 中，我看到您使用的是 src_py 目录。如果不是，请修改这里。
          # 假设您的 Python 文件在项目根目录的 src_py 文件夹下
          if [ -d "$PYTHON_SOURCE_DIR" ]; then
             cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/
             echo "Python source copied from $PYTHON_SOURCE_DIR"
          else
             # 如果您直接把 app.py 等放在根目录
             cp app.py clash_template.yaml data.json requirements.txt $ANDROID_PYTHON_TARGET_DIR/
             echo "Python source copied from root directory"
          fi

      - name: 9. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: 10. Force Create gradle.properties (Your Proven Method)
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo ">>> Forcibly creating $PROPERTIES_FILE to ensure build stability"
          echo "android.useAndroidX=true" > $PROPERTIES_FILE
          echo "android.enableJetifier=true" >> $PROPERTIES_FILE
          echo ">>> Verification: Contents of $PROPERTIES_FILE:"
          cat $PROPERTIES_FILE

      - name: 11. Grant Execute Permission for Gradle Wrapper
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: 12. Build Android APK
        id: build_apk
        working-directory: ./android_app
        run: |
          # 根据上一步确定的构建类型来执行相应的 gradle 命令
          BUILD_TYPE="${{ steps.prepare_build.outputs.BUILD_TYPE }}"
          echo "Starting Gradle build for: $BUILD_TYPE"
          ./gradlew assemble${BUILD_TYPE} --stacktrace
          
          # 定位构建产物
          APK_FOLDER_NAME=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          apk_path=$(find ./app/build/outputs/apk/${APK_FOLDER_NAME} -name "*.apk" | head -n 1)
          
          if [[ -z "$apk_path" ]]; then
            echo "::error::APK not found in ./app/build/outputs/apk/${APK_FOLDER_NAME}/ after build!"
            exit 1
          fi
          
          echo "APK_PATH=$apk_path" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"
          
      - name: 13. [RELEASE ONLY] Rename APK and Create GitHub Release
        if: steps.cz_bump.outputs.version && steps.build_apk.conclusion == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.cz_bump.outputs.version }}"
          name: "Release v${{ steps.cz_bump.outputs.version }}"
          body: ${{ steps.cz_bump.outputs.changelog }}
          files: android_app/${{ steps.build_apk.outputs.APK_PATH }}
          make_latest: true
      
      - name: 14. [DEBUG ONLY] Upload Debug APK to Artifacts
        if: "!startsWith(github.event.head_commit.message, 'fix:') && steps.build_apk.conclusion == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-apk
          path: android_app/${{ steps.build_apk.outputs.APK_PATH }}
