# 文件路径: .github/workflows/android-build.yml

name: Build Android APK

on:
  push:
    branches: [ "master" ]
    # 当安卓项目外壳或唯一的Python源码发生变化时，都触发此工作流
    paths:
      - 'android_app/**'
      - 'src_py/**'
  # 同样允许手动触发
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # [核心步骤] 在编译前，准备好安卓项目的 Python 源代码
      - name: Prepare Python source for Android build
        run: |
          echo "Copying Python source files to the Android project structure..."
          # 1. 创建安卓项目存放Python源码的目录 (使用 -p 确保如果目录已存在也不会报错)
          mkdir -p android_app/app/src/main/python
          # 2. 将 src_py/ 目录下的所有内容递归复制到目标目录
          cp -r src_py/* android_app/app/src/main/python/
          echo "Python source files copied successfully."
          # 3. (可选) 打印出复制后的目录树，方便在Actions日志中调试检查
          echo "Final structure of python source directory:"
          ls -R android_app/app/src/main/python/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 确保此版本与 build.gradle.kts 中配置的一致

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android_app/**/*.gradle*', 'android_app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android_app
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
