# =================================================================
# ==                  最终完美版 (带诊断功能)                    ==
# =================================================================

name: Conditional Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    outputs:
      new_version: ${{ steps.cz_bump.outputs.version }}
      build_type: ${{ steps.prepare_build.outputs.BUILD_TYPE }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 3. Install Commitizen
        run: pip install commitizen

      - name: 4. Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: 5. [RELEASE ONLY] Check Commit Message for 'fix'
        id: check_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == "fix:"* || "$COMMIT_MSG" == "fix："* ]]; then
            echo "IS_FIX_COMMIT=true" >> $GITHUB_OUTPUT
            echo "✅ Commit is a fix. Proceeding with release process."
          else
            echo "IS_FIX_COMMIT=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Commit is NOT a fix. Proceeding with debug build."
          fi

      - name: 6. [DEBUG] Show Git and Commitizen Status BEFORE Bump
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'true'
        run: |
          echo "==================== GIT STATUS ===================="
          echo "Current Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "-------------------- Git Tags --------------------"
          git tag -l | cat
          echo "----------------- Recent Git Log -----------------"
          git log --graph --oneline -n 10
          echo "============= COMMITIZEN CHECK ============="
          echo "Checking if the LATEST commit is bumpable..."
          # [关键修改] 已删除无效的 --no-raise 参数
          cz check --rev-range $(git log -n 2 --pretty=format:"%H" | tail -n 1)..HEAD || true
          echo "=============================================="
 
      - name: 7. [RELEASE ONLY] Bump Version & Get Changelog
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'true'
        id: cz_bump
        run: |
          echo "Attempting to bump version..."
          # [关键修改] 已删除无效的 --no-raise 参数
          if ! cz bump --yes --changelog; then
            echo "::error::'cz bump' failed. This likely means no bumpable commits were found between the last tag and HEAD. Please check the logs from the previous debug step."
            exit 1
          fi
 
          new_version=$(cz version --project)
          echo "✅ Version bumped successfully to: ${new_version}"
 
          changelog_body=$(awk -v ver="## v${new_version}" '/^## v/{if(p)exit; if($0 ~ ver)p=1} p' CHANGELOG.md)
 
          echo "version=${new_version}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${changelog_body}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 8. [RELEASE ONLY] Update Version Code in Gradle
        if: steps.cz_bump.outputs.version
        run: |
          VERSION="${{ steps.cz_bump.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE
          echo "Updated versionCode in $GRADLE_FILE to $VERSION_CODE"

      - name: 9. [RELEASE ONLY] Commit and Push Version Changes
        if: steps.cz_bump.outputs.version
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            NEW_VERSION="${{ steps.cz_bump.outputs.version }}"
            git commit -m "chore(release): bump version to v${NEW_VERSION} and update changelog" -m "[skip ci]"
            git push origin master --follow-tags
          else
            echo "No version changes to commit."
          fi
          
      - name: 10. Prepare Build Environment & Source Files
        id: prepare_build
        run: |
          if [[ -n "${{ steps.cz_bump.outputs.version }}" ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_OUTPUT
            echo "Build Type: Release"
          else
            echo "BUILD_TYPE=Debug" >> $GITHUB_OUTPUT
            echo "Build Type: Debug"
          fi
          
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          echo "Copying Python source files..."
          cp app.py clash_template.yaml data.json requirements.txt $ANDROID_PYTHON_TARGET_DIR/ || echo "Some root python files not found, continuing..."
          cp -r src_py/. $ANDROID_PYTHON_TARGET_DIR/ || echo "src_py directory not found, continuing..."
          echo "Python source copy complete."
          ls -l $ANDROID_PYTHON_TARGET_DIR

      - name: 11. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 12. Force Create gradle.properties
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo "android.useAndroidX=true" > $PROPERTIES_FILE
          echo "android.enableJetifier=true" >> $PROPERTIES_FILE
          cat $PROPERTIES_FILE

      - name: 13. Grant Execute Permission for Gradle Wrapper
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: 14. Build Android APK
        id: build_apk
        working-directory: ./android_app
        run: |
          BUILD_TYPE="${{ steps.prepare_build.outputs.BUILD_TYPE }}"
          echo "Starting Gradle build for: $BUILD_TYPE"
          ./gradlew assemble${BUILD_TYPE} --stacktrace
          
          APK_FOLDER_NAME=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          apk_path=$(find ./app/build/outputs/apk/${APK_FOLDER_NAME} -name "*.apk" -print -quit)
          
          if [[ -z "$apk_path" ]]; then
            echo "::error::APK not found after build!"
            exit 1
          fi
          
          echo "APK_PATH=$apk_path" >> "$GITHUB_OUTPUT"
          
      - name: 15. [RELEASE ONLY] Create GitHub Release
        if: steps.cz_bump.outputs.version && steps.build_apk.conclusion == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.cz_bump.outputs.version }}"
          name: "Release v${{ steps.cz_bump.outputs.version }}"
          body: ${{ steps.cz_bump.outputs.changelog }}
          files: android_app/${{ steps.build_apk.outputs.APK_PATH }}
          make_latest: true
      
      - name: 16. [DEBUG ONLY] Upload Debug APK to Artifacts
        if: steps.cz_bump.outputs.version == '' && steps.build_apk.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-apk
          path: android_app/${{ steps.build_apk.outputs.APK_PATH }}
