# =================================================================
# ==            全新智能条件发布版 (Final Intelligent)           ==
# =================================================================
# 1. 只有 'fix:' 或 'fix：' 开头的 commit 会触发版本提升和 GitHub Release。
# 2. 其他所有 commit (feat, chore 等) 会构建调试包并上传到 Artifacts。
# 3. 完全采纳您成功的 gradle.properties 创建经验。
# 4. 优化了步骤和命名，逻辑更清晰。
# =================================================================

name: Conditional Build, Versioning, and Release

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write # 必须，用于推送版本更新和创建 Release
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    outputs:
      new_version: ${{ steps.cz_bump.outputs.version }}
      build_type: ${{ steps.prepare_build.outputs.BUILD_TYPE }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 3. Install Commitizen
        run: pip install commitizen

      - name: 4. Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: 5. [RELEASE ONLY] Check Commit Message for 'fix'
        id: check_commit
        run: |
          # [关键修改] 同时检查英文冒号 'fix:' 和中文冒号 'fix：'
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == "fix:"* || "$COMMIT_MSG" == "fix："* ]]; then
            echo "IS_FIX_COMMIT=true" >> $GITHUB_OUTPUT
            echo "Commit is a fix. Proceeding with release process."
          else
            echo "IS_FIX_COMMIT=false" >> $GITHUB_OUTPUT
            echo "Commit is NOT a fix. Proceeding with debug build."
          fi

      - name: 6. [RELEASE ONLY] Bump Version & Changelog with Commitizen
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'true'
        id: cz_bump
        run: |
          cz bump --yes
          new_version=$(cz version --project)
          changelog=$(cz changelog --start-rev v`cz version --project -prv` v$new_version)
          
          echo "version=${new_version}" >> $GITHUB_OUTPUT
          # 使用多行字符串语法来安全地处理changelog
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${changelog}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "New Version: $new_version"

      - name: 7. [RELEASE ONLY] Update Version Code in Gradle
        if: steps.cz_bump.outputs.version
        run: |
          VERSION="${{ steps.cz_bump.outputs.version }}"
          # 生成一个基于版本号的、唯一的整数 version code
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          GRADLE_FILE="android_app/app/build.gradle.kts"
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" $GRADLE_FILE
          echo "Updated versionCode in $GRADLE_FILE to $VERSION_CODE"

      - name: 8. [RELEASE ONLY] Commit and Push Version Changes
        if: steps.cz_bump.outputs.version
        run: |
          # 检查是否有文件变动 (build.gradle.kts, CHANGELOG.md)
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore(release): bump version to v${{ steps.cz_bump.outputs.version }} [skip ci]"
            git push
          else
            echo "No version changes to commit."
          fi
          
      - name: 9. Prepare Build Environment & Source Files
        id: prepare_build
        run: |
          if [[ "${{ steps.check_commit.outputs.IS_FIX_COMMIT }}" == "true" ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_OUTPUT
            echo "Build Type: Release"
          else
            echo "BUILD_TYPE=Debug" >> $GITHUB_OUTPUT
            echo "Build Type: Debug"
          fi
          
          # [关键修改] 清理并明确Python源码复制逻辑
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          echo "Copying Python source files from project root to $ANDROID_PYTHON_TARGET_DIR"
          # 复制所有您项目需要的py文件和资源文件
          cp app.py clash_template.yaml data.json requirements.txt $ANDROID_PYTHON_TARGET_DIR/
          echo "Python source copy complete."
          ls -l $ANDROID_PYTHON_TARGET_DIR

      - name: 10. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 11. Force Create gradle.properties (Your Proven Method)
        run: |
          PROPERTIES_FILE="android_app/gradle.properties"
          echo ">>> Forcibly creating $PROPERTIES_FILE to ensure build stability"
          echo "android.useAndroidX=true" > $PROPERTIES_FILE
          echo "android.enableJetifier=true" >> $PROPERTIES_FILE
          echo ">>> Verification: Contents of $PROPERTIES_FILE:"
          cat $PROPERTIES_FILE

      - name: 12. Grant Execute Permission for Gradle Wrapper
        working-directory: ./android_app
        run: chmod +x gradlew

      - name: 13. Build Android APK
        id: build_apk
        working-directory: ./android_app
        run: |
          BUILD_TYPE="${{ steps.prepare_build.outputs.BUILD_TYPE }}"
          echo "Starting Gradle build for: $BUILD_TYPE"
          ./gradlew assemble${BUILD_TYPE} --stacktrace
          
          APK_FOLDER_NAME=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          apk_path=$(find ./app/build/outputs/apk/${APK_FOLDER_NAME} -name "*.apk" -print -quit) # 使用-print -quit更安全
          
          if [[ -z "$apk_path" ]]; then
            echo "::error::APK not found in ./app/build/outputs/apk/${APK_FOLDER_NAME}/ after build!"
            exit 1
          fi
          
          echo "APK_PATH=$apk_path" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"
          
      - name: 14. [RELEASE ONLY] Create GitHub Release
        if: steps.cz_bump.outputs.version && steps.build_apk.conclusion == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.cz_bump.outputs.version }}"
          name: "Release v${{ steps.cz_bump.outputs.version }}"
          body: ${{ steps.cz_bump.outputs.changelog }}
          files: android_app/${{ steps.build_apk.outputs.APK_PATH }}
          make_latest: true
      
      - name: 15. [DEBUG ONLY] Upload Debug APK to Artifacts
        if: steps.check_commit.outputs.IS_FIX_COMMIT == 'false' && steps.build_apk.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-apk
          path: android_app/${{ steps.build_apk.outputs.APK_PATH }}
