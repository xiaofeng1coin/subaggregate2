# 文件路径: .github/workflows/android-build.yml
# 最终完整版本 (包含源码复制 + gradle.properties 修复 + AndroidManifest.xml 诊断)

name: Build Android APK

on:
  push:
    branches: [ "master" ]
    paths:
      - 'android_app/**'
      - 'src_py/**' # 监控Python源码目录的变化
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        # 为所有 run 步骤设置工作目录为项目根目录
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 1: 准备 Python 源码
      - name: Prepare Python source for Android build
        run: |
          echo ">>> Preparing Python source files for the Android build..."
          PYTHON_SOURCE_DIR="src_py"
          ANDROID_PYTHON_TARGET_DIR="android_app/app/src/main/python"
          echo "Source directory: $PYTHON_SOURCE_DIR"
          echo "Target directory: $ANDROID_PYTHON_TARGET_DIR"
          mkdir -p $ANDROID_PYTHON_TARGET_DIR
          cp -r $PYTHON_SOURCE_DIR/. $ANDROID_PYTHON_TARGET_DIR/
          echo ">>> Python source files copied successfully."
          echo ">>> Verifying final structure of the Python source directory in Android project:"
          ls -R $ANDROID_PYTHON_TARGET_DIR

      # 步骤 2: 设置 Java 和 Python 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 步骤 3: 缓存 Gradle 依赖
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android_app/**/*.gradle*', 'android_app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      # 步骤 4: 强制创建正确的 gradle.properties 文件
      - name: Force create gradle.properties at the Gradle project root
        run: |
          echo ">>> Forcibly creating gradle.properties at 'android_app/gradle.properties'"
          GRADLE_PROPERTIES_PATH="android_app/gradle.properties"
          {
            echo "# This file is auto-generated by the CI/CD pipeline"
            echo "# to ensure correct build properties."
            echo ""
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
          } > $GRADLE_PROPERTIES_PATH
          echo ">>> Verification: Contents of $GRADLE_PROPERTIES_PATH:"
          echo "--------------------------------------------------------"
          cat $GRADLE_PROPERTIES_PATH
          echo "--------------------------------------------------------"

      # 步骤 5: 授予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        working-directory: ./android_app
        run: chmod +x gradlew

      # ========================================================================
      # ================== 步骤 6: [新增] 诊断 AndroidManifest.xml =================
      # 在编译前打印出 AndroidManifest.xml 的内容，并显示行号，便于排查语法问题。
      # ========================================================================
      - name: Display AndroidManifest.xml before build
        run: |
          echo ">>> Displaying contents of android_app/app/src/main/AndroidManifest.xml for validation"
          MANIFEST_FILE="android_app/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "----------------------------------------------------------------------------------"
            # 使用 cat -n 可以显示行号
            cat -n "$MANIFEST_FILE"
            echo "----------------------------------------------------------------------------------"
          else
            echo "!!! WARNING: Manifest file not found at $MANIFEST_FILE"
          fi

      # 步骤 7: 执行 Gradle 构建
      - name: Build Debug APK with Gradle
        working-directory: ./android_app
        run: ./gradlew assembleDebug --stacktrace

      # 步骤 8: 上传构建产物 (APK)
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
